name: fintrack_pro
description: Enterprise AI Expense Tracker
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.0.0
  equatable: ^2.0.5
  bloc: ^9.0.0

  # Dependency Injection
  get_it: ^8.3.0
  injectable: ^2.5.0

  # Local Database
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  sqlite3_flutter_libs: ^0.5.41
  path_provider: ^2.1.2
  path: ^1.9.0

  # Cloud + Auth
  supabase_flutter: ^2.5.2

  # Networking
  dio: ^5.4.1
  connectivity_plus: ^6.1.5

  # Security
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.3.0

  # Navigation
  go_router: ^14.0.0

  # UI
  lottie: ^3.1.2
  gpt_markdown: ^1.0.8
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  percent_indicator: ^4.2.3
  flutter_local_notifications: ^17.1.2
  flutter_animate: ^4.5.0
  pinput: ^5.0.0
  cached_network_image: ^3.3.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  fpdart: ^1.1.0
  logger: ^2.4.0
  shared_preferences: ^2.3.0
  timezone: ^0.9.4
  workmanager: ^0.9.0+3
  confetti: ^0.7.0
  flutter_gemma: ^0.12.4
  crypto: ^3.0.3

  # Phase 7 — Camera & SMS
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  telephony: ^0.2.0
  flutter_image_compress: ^2.3.0
  image: ^4.2.0

  # Export
  pdf: ^3.11.1
  printing: ^5.13.1
  share_plus: ^10.0.0
  csv: ^6.0.0

  # Social Auth
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.2

  # Premium / IAP
  purchases_flutter: ^8.2.0

  # Analytics + Crash Reporting
  sentry_flutter: 8.9.0
  google_fonts: ^8.0.2
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.10
  drift_dev: ^2.31.0
  injectable_generator: ^2.6.0
  mocktail: ^1.0.4
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/lottie/
    - assets/images/

flutter_launcher_name:
  name: "FinTrack Pro"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 24
